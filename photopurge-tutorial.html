<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Purge Tutorial</title>
</head>
<body>
  <p>Opening tutorial…</p>
  <script>
    const FALLBACK = 'https://youtu.be/QiApWFnWOy8';
    const metaPattern = /name=["']photopurge-tutorial["'][^>]*content=["']([^"']+)["']/i;

    fetch('/', { cache: 'no-store' })
      .then((response) => response.text())
      .then((html) => {
        const match = html.match(metaPattern);
        const url = match && match[1] ? match[1].trim() : FALLBACK;
        window.location.replace(url);
      })
      .catch(() => {
        window.location.replace(FALLBACK);
      });
  </script>
  <noscript>
    <p><a href="https://youtu.be/QiApWFnWOy8">Open Photo Purge tutorial</a></p>
  </noscript>
</body>
</html>
