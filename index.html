<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Photo Purge tutorial video — update content= when you publish a new video. -->
  <meta name="photopurge-tutorial" content="https://youtu.be/QiApWFnWOy8">
  <title>Heylon Studio — Apps</title>
  <link rel="icon" type="image/png" href="/icon.png">
  <meta property="og:title" content="Heylon Studio — Apps">
  <meta property="og:description" content="Apps by Heylon Studio.">
  <meta property="og:image" content="/banner.png">
  <meta property="og:type" content="website">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1b1b3a 0%, #0e0e12 55%);
      color: #f2f2f5;
    }

    /* Full-width banner */
    .banner {
      display: block;
      width: 100%;
      height: auto;
    }

    .content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    /* One row per app */
    .app-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      padding: 24px 28px;
      margin-bottom: 24px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
    }
    .app-name {
      font-size: 1.7rem;
      font-weight: 800;
      margin-right: 12px;
      min-width: 210px;
      background: linear-gradient(135deg, #8b5cf6, #6ea8fe);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 14px 26px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #f2f2f5;
      background: rgba(255, 255, 255, 0.04);
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      white-space: nowrap;
    }
    .btn:hover { transform: translateY(-2px); background: rgba(255, 255, 255, 0.1); }

    .btn-ios {
      background: linear-gradient(135deg, #6ea8fe, #8b5cf6);
      border: none;
      box-shadow: 0 8px 24px rgba(110, 92, 246, 0.4);
    }
    .btn-ios:hover { box-shadow: 0 12px 30px rgba(110, 92, 246, 0.6); }

    .btn-play {
      background: linear-gradient(135deg, #bbf7d0, #86efac);
      border: none;
      color: #14532d;
      box-shadow: 0 8px 24px rgba(134, 239, 172, 0.4);
    }
    .btn-play:hover { box-shadow: 0 12px 30px rgba(134, 239, 172, 0.6); }

    .btn-video {
      background: linear-gradient(135deg, #2dd4bf, #14b8a6);
      border: none;
      box-shadow: 0 8px 24px rgba(45, 212, 191, 0.4);
    }
    .btn-video:hover { box-shadow: 0 12px 30px rgba(45, 212, 191, 0.6); }

    .btn .badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.2);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    footer {
      text-align: center;
      padding: 32px 20px 48px;
      color: #71717a;
      font-size: 0.9rem;
    }

      .app-name { min-width: 100%; margin-bottom: 4px; }
