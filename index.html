<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Purge — by Heylon Studio</title>
  <link rel="icon" type="image/png" href="/icon.png">
  <meta property="og:title" content="Photo Purge — by Heylon Studio">
  <meta property="og:description" content="Simple, satisfying, and surprisingly effective — clear months of clutter in a single sit-down.">
  <meta property="og:image" content="/banner.png">
  <meta property="og:type" content="website">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1b1b3a 0%, #0e0e12 55%);
      color: #f2f2f5;
    }

    /* Full-width banner */
    .banner {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 18px 16px;
      background: rgba(14, 14, 18, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      font-size: 0.98rem;
      font-weight: 600;
      padding: 11px 20px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #f2f2f5;
      background: rgba(255, 255, 255, 0.04);
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      white-space: nowrap;
    }
    .btn:hover { transform: translateY(-2px); background: rgba(255, 255, 255, 0.1); }

    .btn-primary {
      background: linear-gradient(135deg, #6ea8fe, #8b5cf6);
      border: none;
      box-shadow: 0 8px 24px rgba(110, 92, 246, 0.4);
    }
    .btn-primary:hover { box-shadow: 0 12px 30px rgba(110, 92, 246, 0.6); }

    .btn-play {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border: none;
      box-shadow: 0 8px 24px rgba(34, 197, 94, 0.35);
    }
    .btn-play:hover { box-shadow: 0 12px 30px rgba(34, 197, 94, 0.55); }

    .btn-video {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border: none;
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.3);
    }
    .btn-video:hover { box-shadow: 0 12px 30px rgba(239, 68, 68, 0.5); }

    .btn .badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.25);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    /* Body content area (empty for now) */
    .content {
      max-width: 1000px;
      margin: 0 auto;
      padding: 48px 20px 80px;
    }

    footer {
      text-align: center;
      padding: 32px 20px 48px;
      color: #71717a;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <img class="banner" src="/banner.png" alt="Heylon Studio — Photo Purge">

  <nav class="toolbar">
    <a class="btn btn-primary" href="https://apps.apple.com/app/id6774990861" target="_blank" rel="noopener">Download iOS</a>
    <a class="btn btn-play" href="#" aria-disabled="true">Download Google Play <span class="badge">Soon</span></a>
    <a class="btn btn-video" href="https://youtu.be/1TQHgMa1C_0" target="_blank" rel="noopener">Quick Review</a>
    <a class="btn btn-video" href="https://youtu.be/QiApWFnWOy8" target="_blank" rel="noopener">Tutorial</a>
    <a class="btn" href="/legal/privacy.html">Privacy Policy</a>
  </nav>

  <main class="content">
    <!-- App functionality screenshots will go here -->
  </main>

  <footer>© 2026 Michelle Heylon Pienaar · Heylon Studio</footer>
</body>
</html>
