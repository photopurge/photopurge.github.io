
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Purge — by Heylon Studio</title>
  <link rel="icon" type="image/png" href="/assets/icon.png">
  <meta property="og:title" content="Photo Purge — by Heylon Studio">
  <meta property="og:description" content="Simple, satisfying, and surprisingly effective — clear months of clutter in a single sit-down.">
  <meta property="og:image" content="/assets/banner.png">
  <meta property="og:type" content="website">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1b1b3a 0%, #0e0e12 55%);
      color: #f2f2f5;
      text-align: center;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 40px 20px 64px; }
    .banner {
      width: 100%;
      max-width: 720px;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(80, 60, 200, 0.35);
      margin-bottom: 8px;
    }
    .app-icon {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin: 24px auto 8px;
      display: block;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
    }
    h1 { font-size: 2.4rem; margin: 0.2em 0; }
    p.tag { color: #a8a8b3; font-size: 1.15rem; margin: 0 auto 28px; max-width: 620px; }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #6ea8fe, #8b5cf6);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(110, 92, 246, 0.45);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .cta:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(110, 92, 246, 0.6); }
    .video-block { margin: 44px 0; }
    .video-block h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 16px;
      color: #e4e4e7;
    }
    .video {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    .video iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .links { margin-top: 8px; }
    .links a { color: #6ea8fe; text-decoration: none; margin: 0 12px; }
    footer { margin-top: 48px; color: #71717a; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="banner" src="/assets/banner.png" alt="Heylon Studio">
    <img class="app-icon" src="/assets/icon.png" alt="Photo Purge app icon">
    <h1>Photo Purge</h1>
    <p class="tag">Simple, satisfying, and surprisingly effective — clear months of clutter in a single sit-down.</p>

    <a class="cta" href="https://apps.apple.com/app/id6774990861">Download on the App Store</a>

    <div class="video-block">
      <h2>Quick Review</h2>
      <div class="video">
        <iframe src="https://www.youtube.com/embed/1TQHgMa1C_0"
                title="Photo Purge — Quick Review"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen></iframe>
      </div>
    </div>

    <div class="video-block">
      <h2>Tutorial</h2>
      <div class="video">
        <iframe src="https://www.youtube.com/embed/QiApWFnWOy8"
                title="Photo Purge — Tutorial"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen></iframe>
      </div>
    </div>

    <div class="links">
      <a href="/legal/privacy.html">Privacy Policy</a>
    </div>

    <footer>© 2026 Michelle Heylon Pienaar · Heylon Studio</footer>
  </div>
</body>
</html>
